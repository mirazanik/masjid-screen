<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050D1A" />
    <meta
      name="description"
      content="MasjidScreen — live mosque prayer display for Android TV and tablets. Download on Google Play. Pair a screen, manage jamaat times, and share a public view."
    />
    <meta property="og:title" content="MasjidScreen" />
    <meta
      property="og:description"
      content="Live prayer times, jamaat, hadiths, and notices for mosque TVs. Get the app on Google Play."
    />
    <meta property="og:image" content="/images/feature-graphic.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>MasjidScreen</title>

  <body>
    <div id="app"></div>
    <button type="button" id="installPwa" class="install-fab" hidden>
      <img src="/icons/icon-192.png" alt="" width="28" height="28" />
      <span class="install-label">Install app</span>
    </button>
    <div id="installHint" class="install-hint" hidden>
      <p id="installHintText"></p>
      <button type="button" id="installHintClose">OK</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
